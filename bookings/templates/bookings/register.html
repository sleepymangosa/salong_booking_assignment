{% extends 'bookings/base.html' %}
{% block title %}Create account | Fade &amp; Co.{% endblock %}
{% block content %}
<section class="narrow">
    <h1>Create your account</h1>
    <form method="post" class="panel form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="{% url 'bookings:login' %}">Log in</a>.</p>
</section>
{% endblock %}
